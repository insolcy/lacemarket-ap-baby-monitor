name: Monitor Lace Market

on:
  schedule:
    # Hourly best-effort fallback. The primary 10-minute trigger is the
    # Cloudflare Worker, so running both every 10 minutes only doubles proxy use.
    - cron: "3 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check the website without sending email or changing state"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: lace-market-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 9

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A queued run keeps the SHA from when it was triggered. Always resolve
          # main when the job actually starts so it inherits the previous run's
          # state commit before scanning and writing data/state.json.
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify system Chrome
        run: google-chrome --version

      - name: Validate email secrets
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          test -n "$SMTP_USER" || { echo "Missing SMTP_USER secret"; exit 1; }
          test -n "$SMTP_APP_PASSWORD" || { echo "Missing SMTP_APP_PASSWORD secret"; exit 1; }

      - name: Check for new listings and send alerts
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          PROXY_ROTATION_MODE: iproyal
          # One initial IP plus two rotations is enough to distinguish a bad IP
          # from a provider-wide outage without burning through the pool.
          MAX_PROXY_ROTATIONS: "2"
          OUTAGE_PROBE_INTERVAL_MINUTES: "60"
          OUTAGE_FAILURE_INTERVAL_HOURS: "24"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          BROWSER_CHANNEL: chrome
          HEADLESS: "false"
        run: xvfb-run -a npm run monitor

      - name: Persist monitor state
        # Connectivity failures update only the outage circuit-breaker state.
        # Persist it even though the monitor step intentionally fails once.
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        run: |
          if git diff --quiet -- data/state.json; then
            echo "Monitor state is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update monitor state"
          git pull --rebase origin main
          git push origin HEAD:main
